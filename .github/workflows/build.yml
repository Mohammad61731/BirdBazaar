name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip app
        run: unzip -oq BirdBazaar.zip -d app
      - run: cd app && npm install
      - run: cd app && npx cap add android
      - run: cd app && cp -r android-res/* android/app/src/main/res/
      - name: Set version
        run: |
          cd app
          sed -i "s/versionCode 1/versionCode $((100 + ${{ github.run_number }}))/; s/versionName \"1.0\"/versionName \"1.1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - run: cd app && npx cap sync android
      - run: cd app/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BirdBazaar-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
